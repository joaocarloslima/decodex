<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mensagens Secretas</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1f; --muted: #6e6e73;
    --line: #e3e1dc; --accent: #2f5bea; --me: #2f5bea; --me-ink: #fff; --bot: #efeee9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --card: #1f1f1f; --ink: #f2f2f2; --muted: #a1a1a6;
            --line: #333; --accent: #6b8cff; --me: #3d63e6; --bot: #2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; }
  main { width: 100%; max-width: 720px; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 22px; margin: 0; }
  p.sub { margin: 4px 0 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { font-weight: 600; display: block; margin-bottom: 8px; }
  input, textarea, button { font: inherit; }
  input[type=text] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--bg); color: var(--ink); text-transform: uppercase; letter-spacing: .15em; font-size: 20px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 18px;
           font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .erro { color: #d33; margin-top: 10px; min-height: 1.2em; }
  #chat { display: none; flex-direction: column; gap: 12px; flex: 1; }
  .topo { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff;
            display: grid; place-items: center; font-weight: 700; }
  .nome { font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); }
  #mensagens { display: flex; flex-direction: column; gap: 10px; min-height: 45vh; max-height: 60vh; overflow-y: auto; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.eu { background: var(--me); color: var(--me-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.digitando { color: var(--muted); font-style: italic; }
  form.envio { display: flex; gap: 8px; }
  form.envio textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--bg); color: var(--ink); height: 48px; }
  .aviso { background: #fff4d6; color: #5c4500; border-radius: 10px; padding: 12px 14px; display: none; }
  @media (prefers-color-scheme: dark) { .aviso { background: #3a3013; color: #ffe29a; } }
  .desafio { font-family: ui-monospace, Menlo, monospace; letter-spacing: .1em; }
  #revelacao { display: none; text-align: center; padding: 32px 20px; }
  #revelacao .grande { font-size: 44px; font-weight: 800; margin: 8px 0; }
  #revelacao .papel { font-size: 20px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Mensagens Secretas</h1>
    <p class="sub">Decifre: <span class="desafio">VPFOHP · DEOGY · FRNIH</span></p>
  </header>

  <section id="login" class="card">
    <form id="form-login">
      <label for="codigo">Código de acesso (está na sua folha)</label>
      <input id="codigo" type="text" maxlength="8" autocomplete="off" autofocus>
      <div style="margin-top:12px"><button type="submit">Entrar</button></div>
      <div class="erro" id="erro-login"></div>
    </form>
  </section>

  <section id="chat">
    <div class="card topo">
      <div class="avatar" id="avatar">A</div>
      <div>
        <div class="nome" id="nome-assistente">Assistente</div>
        <div class="status" id="status">Online</div>
      </div>
    </div>
    <div class="aviso" id="aviso"></div>
    <div class="card" id="revelacao">
      <div class="papel">Você conversou com</div>
      <div class="grande" id="rev-nome"></div>
      <div class="papel" id="rev-papel"></div>
    </div>
    <div class="card" id="mensagens"></div>
    <form class="envio" id="form-msg">
      <textarea id="texto" placeholder="Escreva sua mensagem…" maxlength="400"></textarea>
      <button type="submit" id="enviar">Enviar</button>
    </form>
    <div class="erro" id="erro-msg"></div>
  </section>
</main>

<script>
  const SAUDACAO = "Olá! Estou aqui para ajudar com as mensagens secretas. Por onde você quer começar?";
  let token = null;
  try { token = sessionStorage.getItem("token"); } catch (e) {}
  let historicoLocal = [];
  try { historicoLocal = JSON.parse(sessionStorage.getItem("historico") || "[]"); } catch (e) {}
  let rodadaAberta = true;
  let aguardando = false;

  const $ = (id) => document.getElementById(id);

  function salvar() {
    try {
      sessionStorage.setItem("token", token || "");
      sessionStorage.setItem("historico", JSON.stringify(historicoLocal));
    } catch (e) {}
  }

  function adicionar(classe, texto, guardar = true) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    div.textContent = texto;
    $("mensagens").appendChild(div);
    $("mensagens").scrollTop = $("mensagens").scrollHeight;
    if (guardar) { historicoLocal.push({ classe, texto }); salvar(); }
    return div;
  }

  function mostrarChat() {
    $("login").style.display = "none";
    $("chat").style.display = "flex";
    $("mensagens").innerHTML = "";
    adicionar("bot", SAUDACAO, false);
    historicoLocal.forEach(m => adicionar(m.classe, m.texto, false));
    $("texto").focus();
    atualizarEstado();
    setInterval(atualizarEstado, 4000);
  }

  $("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("erro-login").textContent = "";
    const r = await fetch("/api/entrar", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo: $("codigo").value })
    });
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) { $("erro-login").textContent = dados.erro || "Não foi possível entrar."; return; }
    token = dados.token; historicoLocal = []; salvar();
    mostrarChat();
  });

  $("texto").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form-msg").requestSubmit(); }
  });

  $("form-msg").addEventListener("submit", async (e) => {
    e.preventDefault();
    const texto = $("texto").value.trim();
    if (!texto || aguardando || !rodadaAberta) return;
    $("erro-msg").textContent = "";
    $("texto").value = "";
    adicionar("eu", texto);
    aguardando = true; atualizarControles();
    const digitando = adicionar("bot digitando", "digitando…", false);
    try {
      const r = await fetch("/api/mensagem", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, texto })
      });
      const dados = await r.json().catch(() => ({}));
      digitando.remove();
      if (r.status === 401) { sair(); return; }
      if (!r.ok) { $("erro-msg").textContent = dados.erro || "Erro ao enviar."; if (r.status === 423) atualizarEstado(); return; }
      adicionar("bot", dados.resposta);
    } catch (err) {
      digitando.remove();
      $("erro-msg").textContent = "Sem conexão com o servidor.";
    } finally {
      aguardando = false; atualizarControles();
    }
  });

  function atualizarControles() {
    const bloqueado = aguardando || !rodadaAberta;
    $("texto").disabled = bloqueado;
    $("enviar").disabled = bloqueado;
    $("status").textContent = aguardando ? "digitando…" : (rodadaAberta ? "Online" : "Offline");
  }

  async function atualizarEstado() {
    if (!token) return;
    try {
      const r = await fetch("/api/estado?token=" + encodeURIComponent(token));
      if (r.status === 401) { sair(); return; }
      const e = await r.json();
      rodadaAberta = e.aberta;
      atualizarControles();
      const aviso = $("aviso");
      if (!e.aberta && !e.revelada) {
        aviso.style.display = "block";
        aviso.textContent = "A rodada terminou. Feche o notebook e aguarde as instruções.";
      } else {
        aviso.style.display = "none";
      }
      if (e.revelada) {
        $("revelacao").style.display = "block";
        $("rev-nome").textContent = e.nome;
        $("rev-papel").textContent = e.papel + ". " + e.descricao;
        $("nome-assistente").textContent = e.nome;
        $("avatar").textContent = e.nome.charAt(0);
      } else {
        $("revelacao").style.display = "none";
        $("nome-assistente").textContent = "Assistente";
        $("avatar").textContent = "A";
      }
    } catch (err) { /* tenta de novo no próximo ciclo */ }
  }

  function sair() {
    token = null; historicoLocal = []; salvar();
    location.reload();
  }

  if (token) mostrarChat();
</script>
</body>
</html>
