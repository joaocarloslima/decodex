services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8080"
    volumes:
      - logs:/app/logs
    mem_limit: 1g

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  logs:
  caddy_data:
  caddy_config:
